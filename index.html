<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор работ Немеция.рф</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; color: #333; margin: 20px; }
        .container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; flex-wrap: wrap; }
        .panel { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; min-width: 320px; }
        .right-panel { flex: 1.6; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        select, input[type="text"] { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        select:disabled { background: #e9ecef; cursor: not-allowed; }
        .search-box { margin-bottom: 20px; background: #e2e8f0; padding: 15px; border-radius: 6px; }
        .btn-reset { width: 100%; padding: 12px; background: #dc3545; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-reset:hover { background: #bd2130; }
        .result-box { margin-top: 20px; background: #23272a; color: #fff; padding: 15px; border-radius: 6px; }
        .total-price { font-size: 26px; color: #4caf50; font-weight: bold; margin-top: 10px; }
        .work-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
        .section-title { font-size: 1.1em; color: #0056b3; margin-top: 15px; margin-bottom: 10px; border-bottom: 2px solid #0056b3; padding-bottom: 3px; }
        .recommendation-box { background: #fffde7; border: 1px dashed #fbc02d; border-radius: 6px; padding: 10px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <h2 style="text-align: center;">Оперативный расчет стоимости работ — Немеция Омск</h2>

    <div class="container">
        <!-- Левая панель -->
        <div class="panel">
            <div class="search-box">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">Быстрый поиск (модель или мотор)</label>
                <input type="text" id="search-input" placeholder="Например: Tiguan или N57...">
            </div>
            
            <h3>Выбор автомобиля</h3>
            <div class="form-group"><label>Марка</label><select id="brand-select"><option value="">-- Выбрать --</option></select></div>
            <div class="form-group"><label>Модель</label><select id="model-select" disabled><option value="">-- Выбрать --</option></select></div>
            <div class="form-group"><label>Поколение и годы</label><select id="generation-select" disabled><option value="">-- Выбрать --</option></select></div>
            <div class="form-group"><label>Модификация ДВС</label><select id="engine-select" disabled><option value="">-- Выбрать --</option></select></div>
            <div class="form-group"><label>Коробка передач</label><select id="gearbox-select" disabled><option value="">-- Выбрать --</option></select></div>
            <div class="form-group"><label>Привод</label><select id="drive-select" disabled><option value="">-- Выбрать --</option></select></div>
            
            <button class="btn-reset" id="reset-btn">Сбросить расчет</button>
        </div>

        <!-- Правая панель -->
        <div class="panel right-panel" id="works-section" style="display: none;">
            <h3 id="car-info-title" style="color: #333; margin-top: 0;">Автомобиль выбран</h3>
            
            <div class="recommendation-box" id="rec-box">
                <strong style="color: #f57f17;">⚠️ Рекомендация для менеджера:</strong>
                <div id="rec-list" style="font-size: 0.9em; margin-top: 5px; color: #555;"></div>
            </div>

            <div id="works-container" style="max-height: 480px; overflow-y: auto; border: 1px solid #ddd; border-radius: 4px; background: #fafafa; padding: 5px;"></div>
            
            <div class="result-box">
                <div>Нормо-часы (Ремонт ДВС/КПП, 3000₽): <strong id="res-hours-engine">0</strong> н/ч</div>
                <div>Нормо-часы (ТО/Слесарка, 2500₽): <strong id="res-hours-standard">0</strong> н/ч</div>
                <div style="border-top: 1px solid #555; margin-top: 10px; padding-top: 10px;">
                    <div>Ориентировочная стоимость работ:</div>
                    <div class="total-price" id="res-total-cost">0 ₽</div>
                </div>
            </div>
        </div>
    </div>
